name: Build APK
on: { push: { branches: [main] }, workflow_dispatch: {} }
env:
  SINGBOX_VERSION: v1.9.7
  NDK_VERSION: 25.2.9519653
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> $GITHUB_ENV
      - name: Build libbox (sing-box)
        run: |
          git clone --depth 1 --branch $SINGBOX_VERSION https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          go run ./cmd/internal/build_libbox -target android
          mkdir -p $GITHUB_WORKSPACE/app/libs
          cp libbox.aar $GITHUB_WORKSPACE/app/libs/
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: nova-debug-apk, path: app/build/outputs/apk/debug/*.apk }
